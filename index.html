<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão do Grammy</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c7b27d'><path d='M19 3c-3.5 0-6.8 2.4-8.2 5.5L8 10V7H6v4.5c0 .8.7 1.5 1.5 1.5h2.2l2.1 2h-1.3v2h5v-2h-1.5l-1.6-1.6c2.2 1.2 4.6 1.6 6.6 1.6V3zm-2 9.8c-1.8-.2-3.8-.9-5.3-2.3 1.2-2.5 3.3-4.6 5.3-5.2v7.5zM4 18h16v3H4v-3z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Html-to-Image para gerar o download do card -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>
                Bolão do Grammy
                <svg class="icone-titulo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M19 3c-3.5 0-6.8 2.4-8.2 5.5L8 10V7H6v4.5c0 .8.7 1.5 1.5 1.5h2.2l2.1 2h-1.3v2h5v-2h-1.5l-1.6-1.6c2.2 1.2 4.6 1.6 6.6 1.6V3zm-2 9.8c-1.8-.2-3.8-.9-5.3-2.3 1.2-2.5 3.3-4.6 5.3-5.2v7.5zM4 18h16v3H4v-3z"/>
                </svg>
            </h1>
            <p class="subtitle">Faça suas apostas e dispute o topo do ranking</p>
        </header>
        
        <!-- Formulário de Votação -->
        <form id="form-bolao">
            <section id="perfil-section">
                <h2>Seu Perfil</h2>
                <div class="input-grupo" style="margin-bottom: 16px;">
                    <label for="nome-usuario">Seu nome ou @</label>
                    <input type="text" id="nome-usuario" placeholder="Ex: @eduardooordg" required>
                </div>
                
                <div class="input-grupo">
                    <label>Sua foto (opcional)</label>
                    <div class="upload-foto">
                        <div id="preview-container" class="preview-foto"><span>Sem foto</span></div>
                        <div class="upload-acoes">
                            <label for="input-custom-avatar" class="btn-upload">Escolher imagem</label>
                            <input type="file" id="input-custom-avatar" accept="image/*" hidden>
                            <div class="upload-links">
                                <button type="button" id="btn-ajustar-foto" class="btn-link hidden">Ajustar foto</button>
                                <button type="button" id="btn-remover-foto" class="btn-link hidden">Remover foto</button>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" id="avatar-selecionado">
                </div>
            </section>

            <div id="lista-categorias"></div>
            <button type="submit" id="btn-enviar">Enviar Apostas</button>
        </form>

        <!-- Seção de Sucesso / Card Gerado (Fica oculta até enviar) -->
        <div id="sucesso-section" class="hidden">
            <div class="sucesso-card">
                <h2>Apostas Registradas com Sucesso!</h2>
                <p class="subtitle" style="margin-bottom: 20px;">Este é o seu card oficial do bolão:</p>
                
                <!-- O TEMPLATE DO CARD QUE VIRA IMAGEM -->
                <div id="card-template" class="card-template">
                    <div class="card-header-resumo">
                        <img id="card-avatar" class="hidden" alt="Foto">
                        <div id="card-avatar-vazio" class="card-avatar-vazio hidden"></div>
                        <div>
                            <span class="card-tag">BOLÃO DO GRAMMY</span>
                            <h3 id="card-nome"></h3>
                        </div>
                    </div>
                    <div id="card-votos-lista" class="card-votos-lista">
                        <!-- Os votos preenchem aqui -->
                    </div>
                </div>

                <button type="button" id="btn-baixar" class="btn-acao">Baixar meu Card (PNG)</button>
                <button type="button" id="btn-voltar" class="btn-secundario">Fazer novas apostas</button>
            </div>
        </div>
    </div>

    <!-- Editor de foto (arrastar, zoom e girar) -->
    <div id="editor-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editor-titulo">
        <div class="modal-conteudo">
            <h3 id="editor-titulo">Ajustar foto</h3>
            <p class="subtitle">Arraste pra posicionar e use o zoom pra enquadrar.</p>
            <div class="editor-area">
                <canvas id="editor-canvas" width="300" height="300"></canvas>
            </div>
            <div class="editor-controles">
                <button type="button" id="editor-girar" class="btn-secundario">⟳ Girar</button>
                <input type="range" id="editor-zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
            </div>
            <div class="editor-botoes">
                <button type="button" id="editor-cancelar" class="btn-secundario">Cancelar</button>
                <button type="button" id="editor-confirmar" class="btn-acao">Usar foto</button>
            </div>
        </div>
    </div>

    <script src="categorias.js"></script>
    <script src="script.js"></script>
</body>
</html>
