<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão do Grammy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Html-to-Image para gerar o download do card -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Bolão do Grammy 🏆</h1>
            <p class="subtitle">Faça suas apostas e dispute o topo do ranking</p>
        </header>
        
        <!-- Formulário de Votação -->
        <form id="form-bolao">
            <section id="perfil-section">
                <h2>Seu Perfil</h2>
                <div class="input-grupo" style="margin-bottom: 16px;">
                    <label for="nome-usuario">Seu nome ou @</label>
                    <input type="text" id="nome-usuario" placeholder="Ex: @eduardooordg" required>
                </div>
                
                <div class="input-grupo">
                    <label>Escolha seu Avatar</label>
                    <div id="galeria-avatares" class="avatares-grid"></div>
                    <input type="hidden" id="avatar-selecionado" required>
                </div>
            </section>

            <div id="lista-categorias"></div>
            <button type="submit" id="btn-enviar">Enviar Apostas</button>
        </form>

        <!-- Seção de Sucesso / Card Gerado (Fica oculta até enviar) -->
        <div id="sucesso-section" class="hidden">
            <div class="sucesso-card">
                <h2>Apostas Registradas com Sucesso! 🎉</h2>
                <p class="subtitle" style="margin-bottom: 20px;">Este é o seu card oficial do bolão:</p>
                
                <!-- O TEMPLATE DO CARD QUE VIRA IMAGEM -->
                <div id="card-template" class="card-template">
                    <div class="card-header-resumo">
                        <img id="card-avatar" src="" alt="Avatar">
                        <div>
                            <span class="card-tag">BOLÃO DO GRAMMY</span>
                            <h3 id="card-nome"></h3>
                        </div>
                    </div>
                    <div id="card-votos-lista" class="card-votos-lista">
                        <!-- Os votos preenchem aqui -->
                    </div>
                </div>

                <button type="button" id="btn-baixar" class="btn-acao">Baixar meu Card (PNG)</button>
                <button type="button" id="btn-voltar" class="btn-secundario">Fazer novas apostas</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
